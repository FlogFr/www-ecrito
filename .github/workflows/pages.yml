# Génère le site et le publie sur GitHub Pages à chaque push sur main.
# Prérequis : Settings → Pages → Source = « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v5

      - uses: astral-sh/setup-uv@v6

      - name: Générer le site
        run: uv run scripts/build.py
        env:
          # Avec un domaine personnalisé : https://ecrito.fr et un sous-chemin vide.
          # Sinon : https://flogfr.github.io/www-ecrito et le sous-chemin /www-ecrito.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
