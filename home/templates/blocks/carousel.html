{% load i18n wagtailcore_tags %}

<div id="carousel" class="carousel slide">
  <div class="carousel-indicators">
    {% for image in block.value %}
    <button type="button" data-bs-target="#carousel" data-bs-slide-to="{{ forloop.counter0 }}" {% if forloop.counter0 == 0 %}class="active" aria-current="true"{% endif %} aria-label="Slide {{ foorloop.counter0 }}"></button>
    {% endfor %}
  </div>
  <div class="carousel-inner">
    {% for image in block.value %}
    <div class="carousel-item{% if forloop.counter == 1 %} active{% endif %}">
      <img src="{{ image.value.file.url }}" class="d-block" alt="{{ image.value.file.title }}">
      <div class="carousel-caption d-none d-md-block">
        <h5>{{ image.value.file.title }}</h5>
        <p>{{ image.value.file.title }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
