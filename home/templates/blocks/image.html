{% load i18n wagtailcore_tags %}

<div class="px-4 pt-5 my-5 text-center border-bottom">
  <!-- Centered Image -->
  <div class="overflow-hidden" style="max-height: 200vh;">
    <div class="container px-5">
      <img src="{{ block.value.file.url }}" class="img-fluid border rounded-3 shadow-lg mb-4" alt="{{ block.value.file.title }}" loading="lazy" width="700" height="500" />
    </div>
  </div>
  <h1 class="display-4">{{ block.value.title }}</h1>
</div>
