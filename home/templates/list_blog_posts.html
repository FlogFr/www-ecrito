{% load menutags %}

{% with rootpage=self.get_root %}
<div class="list-group">
  {% for homepage in rootpage.get_children %}
  {% for blogpost in homepage|get_children_menu_live %}
  <a href="{{ blogpost.url }}" class="list-group-item list-group-item-action" aria-current="true">
    {{ blogpost.title }}
  </a>
  {% endfor %}
  {% endfor %}
</div>

<ul>
</ul>
{% endwith %}
